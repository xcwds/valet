name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Static build (no cgo)
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-X github.com/xcwds/valet/internal/version.Version=ci-${GITHUB_SHA::12}" -o bin/valet ./cmd/valet
          file bin/valet | tee /dev/stderr | grep -q 'statically linked'
          ln -s valet bin/valetd
          bin/valet version
          bin/valetd version
          # It really starts: serve, answer /healthz, stop on SIGTERM with exit 0.
          VALET_MASTER_KEY=$(bin/valet secrets init-key) VALET_DATA_DIR=/tmp/valet VALET_ADMIN_ADDR=127.0.0.1:14400 bin/valetd &
          for i in $(seq 50); do bin/valet status && break; sleep 0.1; done
          bin/valet status
          # M0 exit: `valet job create` returns a token and the create is audited.
          export VALET_DATA_DIR=/tmp/valet
          bin/valet job create --role reviewer --repo xcwds/site | tee /tmp/job.txt
          grep -q '^token: *vlt_sess_' /tmp/job.txt
          bin/valet audit tail | grep -q '"action":"job.create"'
          bin/valet audit verify
          kill -TERM %1
          wait %1

  deploy:
    name: Deploy smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f deploy/Dockerfile --build-arg VERSION="ci-${GITHUB_SHA::12}" -t ghcr.io/xcwds/valet:dev .

      # Valet plus an agent container on agentnet: no route out, registries
      # only through Charon, admin port unreachable, git routed to Ariadne.
      - name: Smoke test deploy/
        run: deploy/smoke.sh

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, vulncheck, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # ghcr.io/xcwds/valet, nothing else
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push ghcr.io/xcwds/valet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          sha=${GITHUB_SHA::12}
          docker build -f deploy/Dockerfile --build-arg VERSION="main-$sha" \
            -t ghcr.io/xcwds/valet:dev -t "ghcr.io/xcwds/valet:sha-$sha" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push ghcr.io/xcwds/valet:dev
          docker push "ghcr.io/xcwds/valet:sha-$sha"
          docker logout ghcr.io

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
